mas server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**

        - id: customer-service
          uri: http://localhost:8082
          predicates:
            - Path=/customers/**

        - id: inventory-service
          uri: http://localhost:8083
          predicates:
            - Path=/products/**,/stock-reservations/**

        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/notifications/**

        - id: order-service
          uri: http://localhost:8085
          predicates:
            - Path=/orders/**

        - id: payment-service
          uri: http://localhost:8086
          predicates:
            - Path=/payments/**,/wallets/**