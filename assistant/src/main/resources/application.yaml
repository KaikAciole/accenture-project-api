server:
  port: 8087

spring:
  application:
    name: assistant
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
            temperature: 0.7
            max-output-tokens: 800

assistant:
  gemini:
    chunk-idle-timeout-seconds: 30
    total-stream-timeout-seconds: 60
    max-chunks-per-stream: 200
  rate-limit:
    user:
      per-minute: 10
      per-day: 100
    ip:
      per-minute: 30
      per-day: 300
    concurrency:
      max-concurrent-streams: 20

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false
  default-produces-media-type: application/json
