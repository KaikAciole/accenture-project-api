server:
  port: 8081

spring:
  application:
    name: auth

  datasource:
    url: jdbc:h2:mem:authdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://guest:guest@localhost:5672}

api:
  security:
    token:
      secret: ${JWT_SECRET:my-super-secret-key-change-me-in-production}
      expiration-minutes: 60

password-reset:
  token-ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}