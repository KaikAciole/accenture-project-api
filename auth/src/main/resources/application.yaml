server:
  port: 8081

spring:
  application:
    name: auth

  datasource:
    url: jdbc:h2:mem:authdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  rabbitmq:
    addresses: ${RABBITMQ_URL:amqps://seu-usuario:sua-senha@seu-host.rmq.cloudamqp.com/seu-vhost}

api:
  security:
    token:
      secret: ${JWT_SECRET:my-super-secret-key-change-me-in-production}
      expiration-minutes: 60