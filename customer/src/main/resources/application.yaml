server:
  port: 8082

spring:
  application:
    name: customer
  datasource:
    url: jdbc:h2:mem:customer_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

integration:
  viacep:
    base-url: https://viacep.com.br/ws
  auth:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}

api:
  security:
    internal:
      secret: ${INTERNAL_API_SECRET:senha-secreta-microsservicos-1234}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false
  default-produces-media-type: application/json
