server:
  port: 8083

spring:
  application:
    name: inventory

  datasource:
    url: jdbc:h2:mem:inventory_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  rabbitmq:
    addresses: ${RABBITMQ_URL:amqps://seu-usuario:sua-senha@seu-host.rmq.cloudamqp.com/seu-vhost}

inventory:
  messaging:
    payment:
      exchange: payment.events
      queue:
        approved: payment.approved.inventory.queue
        refused: payment.refused.inventory.queue
        canceled: payment.canceled.inventory.queue
      routing-key:
        approved: payment.approved
        refused: payment.refused
        canceled: payment.canceled

    order:
      exchange: order.exchange
      queue:
        created: order.created.inventory.queue
        canceled: order.canceled.inventory.queue
      routing-key:
        created: order.created
        canceled: order.canceled