server:
  port: 8085

spring:
  application:
    name: order

  rabbitmq:
    addresses: ${RABBITMQ_URL:amqps://seu-usuario:sua-senha@seu-host.rmq.cloudamqp.com/seu-vhost}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000ms
          multiplier: 2.0
          max-retries: 5

api:
  customer:
    url: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
  inventory:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8083}
  security:
    internal:
      secret: ${INTERNAL_API_SECRET:senha-secreta-microsservicos-1234}

