server:
  port: 8086

spring:
  application:
    name: payment

  datasource:
    url: jdbc:h2:mem:payment_db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

payment:
  wallet:
    company-owner-id: ${PAYMENT_COMPANY_WALLET_OWNER_ID:00000000-0000-0000-0000-000000000001}