server:
  port: 8086

spring:
  application:
    name: payment

  datasource:
    url: jdbc:h2:mem:payment_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://guest:guest@localhost:5672}

payment:
  wallet:
    company-owner-id: ${PAYMENT_COMPANY_WALLET_OWNER_ID:00000000-0000-0000-0000-000000000001}

  messaging:
    exchange: payment.events
    routing-key:
      approved: payment.approved
      refused: payment.refused
      canceled: payment.canceled
      refunded: payment.refunded

    order:
      exchange: order.exchange
      queue:
        canceled: order.canceled.payment.queue
      routing-key:
        canceled: order.canceled

    customer:
      exchange: auth.exchange
      queue:
        created: user.registered.payment.queue
      routing-key:
        created: user.registered

mercado-pago:
  access-token: ${MERCADO_PAGO_ACCESS_TOKEN}
  public-key: ${MERCADO_PAGO_PUBLIC_KEY}
  notification-url: ${MERCADO_PAGO_NOTIFICATION_URL:http://localhost:8086/webhooks/mercado-pago}


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false
  default-produces-media-type: application/json
